<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu App - Histórico</title>
</head>
<body>

    <div style="padding: 20px; font-family: Arial, sans-serif;">
        <h2>Registar no Histórico</h2>
        
        <!-- Campos do seu formulário/app -->
        <div style="margin-bottom: 10px;">
            <label for="campo1">Campo 1:</label><br>
            <input type="text" id="campo1" style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 10px;">
            <label for="campo2">Campo 2:</label><br>
            <input type="text" id="campo2" style="width: 100%; padding: 8px;">
        </div>

        <!-- Botão "Salvar no Histórico" -->
        <button onclick="salvarHistorico()" style="padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer;">
            Salvar no Histórico
        </button>
    </div>

    <script>
        function salvarHistorico() {
            // 1. Recolhe os valores dos inputs do app
            const val1 = document.getElementById('campo1').value;
            const val2 = document.getElementById('campo2').value;

            // 2. Cole aqui a URL exata que copiou do Apps Script do Google
            const urlWebApps = "COLE_AQUI_A_URL_DO_SEU_WEB_APP";

            // 3. Estrutura os dados em formato JSON
            const dadosParaEnviar = {
                campo1: val1,
                campo2: val2
            };

            // 4. Envia os dados para a planilha via POST
            fetch(urlWebApps, {
                method: 'POST',
                mode: 'no-cors', // Essencial para comunicação direta com o Apps Script
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dadosParaEnviar)
            })
            .then(() => {
                alert('Dados salvos no histórico com sucesso!');
                // Limpa os campos após o envio
                document.getElementById('campo1').value = '';
                document.getElementById('campo2').value = '';
            })
            .catch(error => {
                console.error('Erro ao salvar:', error);
                alert('Ocorreu um erro ao tentar salvar.');
            });
        }
    </script>
</body>
</html>
